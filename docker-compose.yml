services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://curnext.app}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      # Public (also baked via build args; keep in sync for runtime fallbacks)
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://curnext.app}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      # Secrets / server-only
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-}
      DIRECT_URL: ${DIRECT_URL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-2525}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_DEFAULT: ${SMTP_FROM_DEFAULT:-noreply@curnext.app}
      SMTP_FROM_NOREPLY: ${SMTP_FROM_NOREPLY:-info@curnext.app}
      SALES_EMAIL: ${SALES_EMAIL:-sales@curnext.app}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-info@curnext.app}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_JURISDICTION: ${R2_JURISDICTION:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-curnext}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    restart: unless-stopped

  # Optional local Postgres only - prefer Supabase via DATABASE_URL
  db:
    profiles: ["local-db"]
    image: postgres:16-alpine
    container_name: curnext-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: curnext
    volumes:
      - curnext_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d curnext"]
      interval: 2s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  curnext_pg:
